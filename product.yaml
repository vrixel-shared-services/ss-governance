# Shared services governance manifest, read by the Vrixel agentic SDLC tool.
# Shared services ship as versioned packages: libraries, and container images of services such as
# the LLM gateway and the audit sink. They own no runtime: every consuming product runs them in its
# own infrastructure, so this manifest declares no runtime.
product_id: SS
name: Shared services
constitution: constitution.md
context: context.md
budget_usd: 150
critic_threshold: 0.85
max_loops: 3
repos:
# Anthropic Messages API in front of the providers each product's data class allows, with
# redaction, per-agent budgets and a usage ledger (VX-7, VX-12). Ships a container image.
- name: vrixel-shared-services/ss-llm-gateway
  role: library
# Ships a container image each product runs in its own runtime (shared lanes own no runtime).
# Copies the product's Kafka audit topic into a hash-chained Postgres table and an Object Lock archive (VX-15).
- name: vrixel-shared-services/ss-audit-sink
  role: library
approvers:
  g1: [ss-platform-owner]
  g2: [ss-platform-owner]
  g3: [ss-design-lead]
  g4: [ss-architect]
  g5: [ss-security-lead]
  g6: [ss-release-manager]
high_risk_paths: ["src/", "migrations/"]
